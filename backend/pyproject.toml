[project]
name = "tracklistify-backend"
version = "0.1.0"
description = "Tracklistify backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "celery[redis]==5.4.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pydub==0.25.1",
    "aiohttp==3.11.10",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.18",
    "alembic==1.14.0",
]

[project.scripts]
tracklistify-cli = "app.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
